spring:
  # 1. Database 세팅 (도커 MySQL과 연결)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/togetherpay?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME} # 도커의 MYSQL_USER와 일치
    password: ${DB_PASSWORD} # 도커의 MYSQL_PASSWORD와 일치

  # 2. JPA & Hibernate 세팅
  jpa:
    hibernate:
      ddl-auto: update # 개발용: 엔티티가 바뀌면 DB 테이블도 자동으로 수정해 줌 (운영에선 절대 사용 금지!)
    show-sql: true # 콘솔에 SQL문 출력
    properties:
      hibernate:
        format_sql: true # SQL문을 예쁘게 줄바꿈해서 보여줌
        # default_batch_fetch_size: 1000 # N+1 문제 방지용 필수 세팅!
        query:
          in_clause_parameter_padding: true

  # 3. Redis 세팅 (도커 Redis와 연결)
  data:
    redis:
      host: localhost
      port: 6379

  # 4. OAuth2 소셜 로그인 세팅 (구글, 카카오)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}         # 인텔리제이 환경변수에서 주입
            client-secret: ${GOOGLE_CLIENT_SECRET} # 인텔리제이 환경변수에서 주입
            scope: profile, email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}          # 인텔리제이 환경변수에서 주입
            client-secret: ${KAKAO_CLIENT_SECRET}  # 인텔리제이 환경변수에서 주입
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao: # 카카오는 스프링이 기본 제공하지 않아서 직접 주소를 적어줘야 함
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # 5. openChatAI 세팅
  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://factchat-cloud.mindlogic.ai
      chat:
        completions-path: /v1/gateway/chat/completions/
        options:
          model: gpt-5.4

# 6. 우리가 만든 JWT 커스텀 세팅
jwt:
  # Base64로 인코딩된 최소 32바이트(256비트) 이상의 문자열을 환경변수로 주입!
  client-secret: ${JWT_SECRET_KEY}
  expiry-seconds: 3600 # Access Token: 1시간
  refresh-expiry-seconds: 1209600 # Refresh Token: 14일

# 7. 로깅 레벨 세팅
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace # SQL 쿼리의 ? 에 들어가는 진짜 값을 보여줌

openApi:
  auth-key: ${AUTH_KEY}

google:
  places:
    api-key: ${GOOGLE_PLACES_API_KEY}
